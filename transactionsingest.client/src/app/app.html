<h1 id="tableLabel">Transaction Ingest</h1>

<p *ngIf="!transactions()"><em>Loading...</em></p>

<table @if (transactions(); as transactions>
    <thead>
        <tr>
            <th>Source System</th>
            <th>Transaction Id</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let transaction of transactions()">
            <td>{{ transaction.sourceSystem }}</td>
            <td>{{ transaction.transactionId }}</td>
        </tr>
    </tbody>
</table>
